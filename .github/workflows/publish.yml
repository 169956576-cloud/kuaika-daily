name: Publish kuaika.com

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kuaika-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Refresh daily source snapshot
        id: sync
        continue-on-error: true
        run: npm run sync

      - name: Save daily snapshot
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/zxfps-latest.json data/zxfps-$(TZ=Asia/Shanghai date +%F).json
          git diff --cached --quiet || git commit -m "Refresh daily market snapshot"
          git push

      - name: Prepare Pages files
        run: |
          mkdir -p site/data
          cp index.html app.mjs logic.mjs style.css .nojekyll site/
          cp data/zxfps-latest.json site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
